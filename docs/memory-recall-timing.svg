<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="1184" height="604" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 标题 -->
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Session Memory · 召回时机（src/minimal_agent/agent/context.py）</text>
  <text x="600" y="56" text-anchor="middle" font-size="13" fill="#64748b">ContextBuilder.prepare() 在每次 LLM 调用前执行；触发 80% 阈值时，只压缩已完成的旧轮</text>

  <!-- ============ ① 召回时机 ============ -->
  <rect x="30" y="78" width="1140" height="200" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <rect x="48" y="86" width="96" height="24" rx="6" fill="#0f766e"/>
  <text x="96" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">① 召回时机</text>

  <rect x="60" y="130" width="170" height="70" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="145" y="154" text-anchor="middle" font-size="14" font-weight="700" fill="#134e4a">用户消息 · 创建 Run</text>
  <text x="145" y="176" text-anchor="middle" font-size="12.5" fill="#334155">POST messages → 202</text>

  <line x1="230" y1="165" x2="256" y2="165" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="260" y="130" width="230" height="70" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="375" y="154" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">召回点 A · 首次回答前</text>
  <text x="375" y="176" text-anchor="middle" font-size="12.5" fill="#334155">ContextBuilder.prepare()</text>
  <text x="375" y="194" text-anchor="middle" font-size="12.5" fill="#334155">每次 LLM 调用前都会执行</text>

  <line x1="490" y1="165" x2="516" y2="165" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="520" y="130" width="160" height="70" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="600" y="154" text-anchor="middle" font-size="14" font-weight="700" fill="#134e4a">LLM 决策</text>
  <text x="600" y="176" text-anchor="middle" font-size="12.5" fill="#334155">StepAccumulator 汇总</text>
  <text x="600" y="194" text-anchor="middle" font-size="12.5" fill="#334155">工具调用 或 最终答案</text>

  <line x1="680" y1="165" x2="706" y2="165" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="710" y="130" width="180" height="70" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="800" y="154" text-anchor="middle" font-size="14" font-weight="700" fill="#134e4a">工具调用 → 结果回填</text>
  <text x="800" y="176" text-anchor="middle" font-size="12.5" fill="#334155">DurableToolExecutor 执行</text>
  <text x="800" y="194" text-anchor="middle" font-size="12.5" fill="#334155">tool_result 写入消息历史</text>

  <line x1="890" y1="165" x2="916" y2="165" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="920" y="130" width="220" height="70" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="1030" y="154" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">召回点 B · 工具完成后</text>
  <text x="1030" y="176" text-anchor="middle" font-size="12.5" fill="#334155">下一回合 LLM 调用前</text>
  <text x="1030" y="194" text-anchor="middle" font-size="12.5" fill="#334155">再次 prepare() 召回</text>

  <path d="M 1030 200 L 1030 224 L 600 224 L 600 204" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrow-orange)"/>
  <text x="700" y="216" font-size="12" fill="#c2410c">↺ 下一回合（≤ 8 步）</text>

  <text x="60" y="252" font-size="12.5" fill="#475569">每次召回只读取当前 Session 的 SQLite（sessions / messages / runs），不跨 Session；工具结果进入消息历史后自然参与下一次召回。</text>

  <!-- ============ ② 压缩判定 ============ -->
  <rect x="30" y="290" width="1140" height="280" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <rect x="48" y="298" width="96" height="24" rx="6" fill="#d97706"/>
  <text x="96" y="314" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">② 压缩判定</text>

  <rect x="60" y="325" width="230" height="66" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="175" y="349" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">ContextBuilder.prepare()</text>
  <text x="175" y="371" text-anchor="middle" font-size="12.5" fill="#334155">装配上下文 + 估算输入 token（启发式）</text>

  <line x1="290" y1="358" x2="326" y2="358" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polygon points="400,335 470,358 400,381 330,358" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="400" y="363" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">输入 ≥ 80% 窗口？</text>

  <path d="M 400 381 L 400 396" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="393" font-size="11.5" fill="#16a34a">否 →</text>

  <rect x="300" y="400" width="200" height="50" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="400" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">无需压缩</text>
  <text x="400" y="443" text-anchor="middle" font-size="12.5" fill="#334155">已有摘要 + 摘要后原始消息</text>

  <line x1="400" y1="450" x2="400" y2="468" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="472" width="200" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="400" y="496" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">进入 LLM 调用</text>
  <text x="400" y="516" text-anchor="middle" font-size="12.5" fill="#334155">摘要 + 消息 + 工具 Schema</text>

  <path d="M 470 358 L 496 358" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="478" y="350" font-size="11.5" fill="#b45309">是 →</text>

  <rect x="500" y="325" width="310" height="66" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="655" y="349" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">挑选压缩候选</text>
  <text x="655" y="371" text-anchor="middle" font-size="12.5" fill="#334155">仅已完成旧轮可压缩</text>
  <text x="655" y="389" text-anchor="middle" font-size="12.5" fill="#334155">保留最近 5 轮 + 当前未完成 Run 原文</text>

  <line x1="655" y1="391" x2="655" y2="407" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="500" y="411" width="310" height="60" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="655" y="435" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">LLM 生成 / 合并摘要</text>
  <text x="655" y="457" text-anchor="middle" font-size="12.5" fill="#334155">更新 sessions.summary</text>
  <text x="655" y="469" text-anchor="middle" font-size="12.5" fill="#334155">summary_through_seq 单调推进</text>

  <line x1="655" y1="471" x2="655" y2="485" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polygon points="655,489 725,511 655,533 585,511" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="655" y="516" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">重建后仍 ≥ 80%？</text>

  <path d="M 655 533 L 655 550 L 500 550 L 500 528" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="515" y="542" font-size="11.5" fill="#16a34a">否 → 放行</text>

  <path d="M 725 511 L 736 511" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="503" font-size="11.5" fill="#dc2626">是 →</text>

  <rect x="740" y="485" width="250" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="865" y="509" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">CONTEXT_LIMIT_EXCEEDED</text>
  <text x="865" y="529" text-anchor="middle" font-size="12.5" fill="#334155">无可压缩轮次或仍超限 → Run 失败</text>

  <text x="60" y="548" font-size="12.5" fill="#475569">压缩只发生在已完成的旧轮之间；当前未完成 Run 永不参与压缩。</text>

  <!-- 图例 -->
  <rect x="60" y="590" width="12" height="12" rx="3" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/>
  <text x="78" y="600" font-size="12" fill="#475569">召回时机</text>
  <rect x="160" y="590" width="12" height="12" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="178" y="600" font-size="12" fill="#475569">压缩判定</text>
  <rect x="260" y="590" width="12" height="12" rx="3" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="278" y="600" font-size="12" fill="#475569">召回点</text>
  <rect x="340" y="590" width="12" height="12" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="358" y="600" font-size="12" fill="#475569">失败终止</text>
  <text x="440" y="600" font-size="12" fill="#475569">灰箭头 = 正常流向 · 橙虚线箭头 = 回环</text>
</svg>
